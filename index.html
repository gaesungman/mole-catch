<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>두더지 잡기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(#bfe6ff, #e8f7d4);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      user-select: none;
      color: #3b2a1a;
    }

    h1 { font-size: 32px; margin-bottom: 12px; }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hud div {
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      min-width: 78px;
      text-align: center;
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: min(92vw, 420px);
      background: #7cc35a;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 0 #5a9a3e;
    }

    .hole {
      position: relative;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 75%, #3a2414 45%, #5b3a22 70%);
      cursor: pointer;
    }

    /* 두더지 (CSS로 그림) */
    .mole {
      position: absolute;
      left: 15%;
      width: 70%;
      height: 80%;
      top: 100%;
      background: #8b5a2b;
      border-radius: 50% 50% 40% 40%;
      transition: top 0.12s ease-out;
    }
    .mole::before, .mole::after { /* 눈 */
      content: "";
      position: absolute;
      top: 28%;
      width: 12%;
      height: 14%;
      background: #1a1a1a;
      border-radius: 50%;
    }
    .mole::before { left: 28%; }
    .mole::after { right: 28%; }
    .mole .nose {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      width: 26%;
      height: 16%;
      background: #f29bb0;
      border-radius: 50%;
    }
    .hole.up .mole { top: 22%; }
    /* 황금 두더지 */
    .hole.gold .mole {
      background: radial-gradient(circle at 35% 30%, #fff6b0, #f5c518 55%, #c99a06);
      box-shadow: 0 0 14px 4px rgba(255, 215, 0, .8);
    }
    .hole.hit .mole { background: #c0392b; top: 22%; }
    .hole.hit .mole::before, .hole.hit .mole::after {
      background: transparent;
      height: 4%;
      border-top: 3px solid #1a1a1a;
      border-radius: 0;
    }

    .pop {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 3px rgba(0,0,0,.4);
      pointer-events: none;
      animation: pop 0.5s ease-out forwards;
    }
    .pop.gold { color: #ffd700; font-size: 28px; }
    @keyframes pop {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, -30px); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.88);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay p { font-size: 18px; line-height: 1.5; word-break: keep-all; }
    .overlay .big { font-size: 28px; font-weight: 800; }
    .overlay .record { color: #d35400; font-weight: 800; }

    /* 게임 시간·난이도 선택 */
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-row .label { font-size: 14px; font-weight: 700; color: #6b5640; min-width: 34px; }
    .time-select { display: flex; gap: 8px; }
    .time-select button {
      font-size: 16px;
      padding: 8px 16px;
      color: #3b2a1a;
      background: #fff;
      border: 2px solid #e0c9a6;
      box-shadow: none;
    }
    .time-select button.selected {
      color: #fff;
      background: #8b5a2b;
      border-color: #8b5a2b;
    }
    .time-select button:active { transform: none; box-shadow: none; }

    button {
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: #e67e22;
      border: none;
      border-radius: 14px;
      padding: 12px 32px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b35f12;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b35f12; }

    /* 소리 켜기/끄기 버튼 */
    .hud .sound-btn {
      min-width: 0;
      width: 44px;
      padding: 0;
      font-size: 22px;
      line-height: 40px;
      color: #3b2a1a;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .hud .sound-btn:active { transform: translateY(1px); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    /* 게임이 끝날 때마다 나오는 따뜻한 한마디 */
    .quote {
      width: min(92vw, 420px);
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(255,255,255,.7);
      border-radius: 14px;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .quote.show { opacity: 1; transform: translateY(0); }
    .quote.hidden { display: none; }
    .quote .text { font-size: 16px; font-weight: 700; word-break: keep-all; }
    .quote .emoji { font-size: 26px; margin-bottom: 4px; }

    /* 최고 기록까지 남은 점수 안내 */
    .overlay .nudge { color: #d35400; font-weight: 800; }
    /* 15분 휴식 안내 */
    .overlay .rest {
      font-size: 15px;
      background: #fff4e0;
      border-radius: 10px;
      padding: 6px 12px;
      color: #8b5a2b;
    }
    /* 키보드 안내 (마우스·키보드 환경에서만 보임) */
    .key-hint { display: none; font-size: 13px; color: #8a7560; }
    @media (hover: hover) and (pointer: fine) { .key-hint { display: block; } }

    /* 한마디 도감 */
    .quote .new-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: #e67e22;
      border-radius: 8px;
      vertical-align: 2px;
    }
    .collection {
      width: min(92vw, 420px);
      margin-top: 10px;
      background: rgba(255,255,255,.55);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
    }
    .collection summary { cursor: pointer; font-weight: 700; color: #6b5640; }
    .collection ul { list-style: none; margin-top: 8px; max-height: 260px; overflow-y: auto; }
    .collection li { padding: 5px 0; border-top: 1px dashed #e0c9a6; line-height: 1.5; }
    .collection li.locked { color: #b3a28f; }

    /* 휴대폰처럼 좁은 화면: 끝 화면 글과 점수판을 조금 작게 */
    @media (max-width: 440px) {
      .hud { gap: 6px; }
      .hud div { min-width: 0; padding: 7px 9px; font-size: 15px; }
      .hud .sound-btn { width: 38px; font-size: 19px; line-height: 36px; }
      .overlay { gap: 7px; padding: 12px; }
      .overlay .big { font-size: 23px; }
      .overlay p { font-size: 15px; line-height: 1.45; }
      .overlay .rest { font-size: 13px; padding: 4px 10px; }
      .time-select button { font-size: 15px; padding: 6px 12px; }
      button { font-size: 18px; padding: 10px 26px; }
    }

    footer { margin-top: 18px; font-size: 13px; color: #5b6b4a; }
  </style>
</head>
<body>
  <h1>🔨 두더지 잡기</h1>

  <div class="hud">
    <div>단계 <span id="level">2</span></div>
    <div>점수 <span id="score">0</span></div>
    <div>시간 <span id="time">20</span></div>
    <div>최고 <span id="best">0</span></div>
    <button class="sound-btn" id="sound-btn" title="소리 켜기/끄기" aria-label="소리 끄기">🔊</button>
  </div>

  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <p class="big" id="msg-title">두더지를 잡아라!</p>
      <p id="msg-body">튀어나오는 두더지를 최대한 많이<br />클릭(터치)하세요.<br />✨ 황금 두더지는 <b>+3점</b>!</p>
      <div class="option-row">
        <span class="label">난이도</span>
        <div class="time-select" id="level-select">
          <button data-level="1">1단계</button>
          <button data-level="2" class="selected">2단계</button>
          <button data-level="3">3단계</button>
        </div>
      </div>
      <div class="option-row">
        <span class="label">시간</span>
        <div class="time-select" id="time-select">
          <button data-sec="20" class="selected">20초</button>
          <button data-sec="30">30초</button>
          <button data-sec="60">60초</button>
        </div>
      </div>
      <button id="start-btn">시작하기</button>
      <p class="key-hint">⌨️ 스페이스바나 엔터로도 시작할 수 있어요</p>
    </div>
  </div>

  <div class="quote hidden" id="quote">
    <p class="emoji" id="quote-emoji"></p>
    <p class="text" id="quote-text"></p>
  </div>

  <details class="collection" id="collection">
    <summary id="collection-title">📖 모은 한마디 0/30</summary>
    <ul id="collection-list"></ul>
  </details>

  <footer>Made with Aside</footer>

  <script>
    // ===== 소리 (Web Audio로 직접 만든 효과음·배경음악, 외부 음원 파일 없음) =====
    const Sound = (() => {
      let ctx = null, master = null, bgmGain = null, sfxGain = null;
      let muted = false;
      try { muted = localStorage.getItem("mole-muted") === "1"; } catch (e) {}

      // 브라우저 정책상 첫 클릭(터치) 이후에만 소리를 낼 수 있어서, 그때 준비
      function ensure() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
          bgmGain = ctx.createGain(); bgmGain.gain.value = 0.35; bgmGain.connect(master);
          sfxGain = ctx.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }

      // 음 하나 내기: 파형, 시작·끝 주파수, 길이, 볼륨
      function tone(type, f1, f2, start, dur, vol, out) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f1, start);
        if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g); g.connect(out || sfxGain);
        o.start(start); o.stop(start + dur + 0.02);
      }

      // 두더지 잡았을 때: "뿅"
      function hit() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        tone("square", 900, 300, t, 0.09, 0.25);
        tone("sine", 1400, 1400, t + 0.05, 0.08, 0.15);
      }
      // 황금 두더지: "띠링~" 올라가는 3음
      function gold() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        [1047, 1319, 1568, 2093].forEach((f, i) => tone("triangle", f, f, t + i * 0.06, 0.16, 0.25));
      }
      // 헛손질(빈 구멍 클릭): 낮은 "퉁"
      function miss() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        tone("triangle", 220, 70, t, 0.18, 0.35);
      }

      // --- 배경음악: 직접 작곡한 4마디 반복 멜로디 (8분음표 단위, 0 = 쉼표) ---
      const MELODY = [76,0,79,76, 72,74,76,0,  77,0,81,77, 74,76,77,0,
                      79,81,79,77, 76,74,72,0,  74,76,74,71, 72,0,0,0];
      const BASS   = [48,0,43,0, 48,0,43,0,  41,0,48,0, 41,0,48,0,
                      43,0,50,0, 43,0,50,0,  43,0,47,0, 48,0,0,0];
      const midi = n => 440 * Math.pow(2, (n - 69) / 12);
      let bgmTimer = null, step = 0, nextTime = 0, bpm = 140;

      function scheduleBgm() {
        const eighth = 60 / bpm / 2;
        while (nextTime < ctx.currentTime + 0.15) {
          const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
          if (m) tone("square", midi(m), midi(m), nextTime, eighth * 0.9, 0.12, bgmGain);
          if (b) tone("triangle", midi(b), midi(b), nextTime, eighth * 1.8, 0.3, bgmGain);
          step++;
          nextTime += eighth;
        }
      }
      function startBgm(tempo) {
        if (!ensure()) return;
        stopBgm();
        bpm = tempo; step = 0; nextTime = ctx.currentTime + 0.05;
        scheduleBgm();
        bgmTimer = setInterval(scheduleBgm, 30);
      }
      function stopBgm() { clearInterval(bgmTimer); bgmTimer = null; }

      function setMuted(v) {
        muted = v;
        try { localStorage.setItem("mole-muted", v ? "1" : "0"); } catch (e) {}
        if (master) master.gain.setValueAtTime(v ? 0 : 1, ctx.currentTime);
      }

      // 다른 탭으로 가면 소리 멈춤, 돌아오면 다시
      document.addEventListener("visibilitychange", () => {
        if (!ctx) return;
        if (document.hidden) ctx.suspend(); else ctx.resume();
      });

      return { ensure, hit, gold, miss, startBgm, stopBgm, setMuted, isMuted: () => muted };
    })();

    // ===== 게임이 끝날 때마다 보여 줄 따뜻한 한마디 (직접 작성) =====
    const MESSAGES = [
      ["🌷", "오늘도 여기까지 온 당신, 정말 수고 많았어요."],
      ["💛", "점수보다 즐거웠던 마음이 더 소중해요."],
      ["🥤", "잠깐 쉬어 가도 괜찮아요. 물 한 잔 마시고 오세요."],
      ["🎁", "당신의 웃음이 누군가에게는 오늘의 선물이에요."],
      ["🍀", "실수해도 괜찮아요. 다시 하면 되니까요."],
      ["☀️", "오늘 하루도 잘 버텨 낸 당신을 응원해요."],
      ["🤗", "빠른 손보다 따뜻한 마음이 더 멋져요."],
      ["👍", "당신은 생각보다 훨씬 잘하고 있어요."],
      ["🙆", "어깨 한번 쭉 펴 볼까요? 오늘도 고생 많았어요."],
      ["💌", "좋아하는 사람에게 안부 한 줄 보내 보는 건 어때요?"],
      ["🐢", "천천히 가도 괜찮아요. 멈추지만 않으면 돼요."],
      ["🏆", "지금 이 순간을 즐긴 당신이 진짜 승자예요."],
      ["🌈", "당신이 있어서 누군가의 하루가 조금 더 밝아져요."],
      ["✨", "오늘 잘한 일 하나만 떠올려 보세요. 분명 있을 거예요."],
      ["👀", "눈이 피곤하면 먼 곳을 잠깐 바라봐 주세요."],
      ["🎈", "기록은 다음에 깨면 되고, 오늘은 즐거웠으면 됐어요."],
      ["💪", "아무도 몰라도 당신은 알잖아요. 충분히 잘했어요."],
      ["🍰", "힘든 날엔 맛있는 거 먹어도 돼요. 그럴 자격 있어요."],
      ["🐹", "함께 놀아 줘서 고마워요. 두더지들도 즐거웠대요."],
      ["📣", "다음 판도 응원할게요. 할 수 있어요!"],
      ["🌱", "오늘의 당신, 어제보다 한 뼘 더 자랐어요."],
      ["💐", "너무 애쓰지 않아도 괜찮아요. 당신은 이미 소중해요."],
      ["😊", "게임하는 동안 웃었다면, 그걸로 충분해요."],
      ["🌬️", "걱정은 잠시 내려놓고, 숨 한번 크게 쉬어 봐요."],
      ["🙏", "고마운 사람에게 \"고마워\" 한마디, 오늘 건네 볼까요?"],
      ["🌙", "당신의 하루 끝이 포근하길 바라요."],
      ["🌤️", "잘 안 풀리는 날도 지나가요. 내일은 더 좋을 거예요."],
      ["🔨", "두더지는 놓쳐도, 좋은 하루는 놓치지 마세요."],
      ["🖐️", "손목도 잠깐 돌려 주세요. 오래 즐기려면 쉬는 것도 중요해요."],
      ["📬", "당신을 응원하는 사람이 생각보다 많아요."],
    ];
    let lastMessage = -1;
    const quoteBox = document.getElementById("quote");

    // 한마디 도감: 만난 한마디 번호를 저장 (저장소가 막혀 있어도 이번 방문 동안은 기억)
    let collected = [];
    try { collected = JSON.parse(localStorage.getItem("mole-collected") || "[]"); } catch (e) { collected = []; }
    function saveCollected() {
      try { localStorage.setItem("mole-collected", JSON.stringify(collected)); } catch (e) {}
    }
    function renderCollection() {
      const n = collected.length, total = MESSAGES.length;
      document.getElementById("collection-title").textContent =
        n >= total ? `📖 모은 한마디 ${n}/${total} 🎉 모두 모았어요!` : `📖 모은 한마디 ${n}/${total}`;
      const list = document.getElementById("collection-list");
      list.innerHTML = "";
      MESSAGES.forEach((m, idx) => {
        const li = document.createElement("li");
        if (collected.includes(idx)) li.textContent = m[0] + " " + m[1];
        else { li.className = "locked"; li.textContent = "🔒 아직 만나지 못한 한마디"; }
        list.appendChild(li);
      });
    }

    function showRandomQuote() {
      // 아직 못 만난 한마디가 있으면 60% 확률로 그중에서 고름 (도감 채우는 재미)
      const unseen = MESSAGES.map((_, idx) => idx).filter(idx => !collected.includes(idx) && idx !== lastMessage);
      let i;
      if (unseen.length && Math.random() < 0.6) {
        i = unseen[Math.floor(Math.random() * unseen.length)];
      } else {
        do { i = Math.floor(Math.random() * MESSAGES.length); } while (i === lastMessage); // 같은 한마디 연속 방지
      }
      lastMessage = i;
      const isNew = !collected.includes(i);
      if (isNew) { collected.push(i); saveCollected(); renderCollection(); }
      document.getElementById("quote-emoji").textContent = MESSAGES[i][0];
      const textEl = document.getElementById("quote-text");
      textEl.textContent = MESSAGES[i][1];
      if (isNew) {
        const badge = document.createElement("span");
        badge.className = "new-badge";
        badge.textContent = "NEW";
        textEl.appendChild(badge);
      }
      quoteBox.classList.remove("hidden", "show");
      void quoteBox.offsetWidth; // 애니메이션 다시 시작
      quoteBox.classList.add("show");
    }
    function hideQuote() { quoteBox.classList.add("hidden"); quoteBox.classList.remove("show"); }

    const GOLD_CHANCE = 0.12; // 황금 두더지 등장 확률 (12%)
    let gameSeconds = 20;     // 선택한 게임 시간

    // 난이도별 속도 설정 (단위: 밀리초, 1000 = 1초)
    //   startUp : 게임 시작 때 두더지가 올라와 있는 시간 (클수록 느림)
    //   minUp   : 아무리 빨라져도 이보다 짧아지지 않는 한계
    //   speedUp : 1초 지날 때마다 줄어드는 시간 (클수록 빨리 빨라짐)
    //   gapMin, gapMax : 두더지가 숨은 뒤 다음 두더지가 나올 때까지 쉬는 시간
    const LEVELS = {
      1: { name: "느림", bgmTempo: 120, startUp: 1400, minUp: 750, speedUp: 12, gapMin: 300, gapMax: 650 },
      2: { name: "보통", bgmTempo: 140, startUp: 1000, minUp: 450, speedUp: 18, gapMin: 150, gapMax: 400 },
      3: { name: "빠름", bgmTempo: 165, startUp: 700,  minUp: 320, speedUp: 22, gapMin: 60,  gapMax: 220 },
    };
    let level = 2;            // 선택한 난이도 (기본 2단계)
    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const levelEl = document.getElementById("level");
    const bestEl = document.getElementById("best");
    const titleEl = document.getElementById("msg-title");
    const bodyEl = document.getElementById("msg-body");
    const startBtn = document.getElementById("start-btn");

    // 구멍 9개 만들기
    const holes = [];
    for (let i = 0; i < 9; i++) {
      const hole = document.createElement("div");
      hole.className = "hole";
      hole.innerHTML = '<div class="mole"><div class="nose"></div></div>';
      hole.addEventListener("pointerdown", () => whack(hole));
      board.insertBefore(hole, overlay);
      holes.push(hole);
    }

    let score = 0;
    let running = false;
    let endTime = 0;
    let lastHole = null;
    let spawnTimer = null;
    let tickTimer = null;
    // 최고 기록 저장 (시크릿 모드 등 저장소가 막혀 있어도 게임은 동작하도록)
    // 난이도·시간별로 따로 저장 (예: 1단계 20초 → mole-best-L1-20)
    // 2단계는 난이도 기능 이전 기록과 같은 키(mole-best-20)를 써서 예전 기록을 이어감
    function bestKey() {
      return level === 2 ? "mole-best-" + gameSeconds : "mole-best-L" + level + "-" + gameSeconds;
    }
    function loadBest() {
      try { return Number(localStorage.getItem(bestKey()) || 0); } catch (e) { return 0; }
    }
    function saveBest(value) {
      try { localStorage.setItem(bestKey(), value); } catch (e) {}
    }
    let best = loadBest();
    bestEl.textContent = best;

    // 시간 선택 버튼
    const timeButtons = document.querySelectorAll("#time-select button");
    timeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        gameSeconds = Number(btn.dataset.sec);
        timeButtons.forEach(b => b.classList.toggle("selected", b === btn));
        timeEl.textContent = gameSeconds;
        best = loadBest();
        bestEl.textContent = best;
      });
    });

    // 난이도 선택 버튼
    const levelButtons = document.querySelectorAll("#level-select button");
    levelButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        level = Number(btn.dataset.level);
        levelButtons.forEach(b => b.classList.toggle("selected", b === btn));
        levelEl.textContent = level;
        best = loadBest();
        bestEl.textContent = best;
      });
    });

    function randomHole() {
      let hole;
      do { hole = holes[Math.floor(Math.random() * holes.length)]; }
      while (hole === lastHole);
      lastHole = hole;
      return hole;
    }

    // 시간이 지날수록 두더지가 빨라짐 (난이도에 따라 시작 속도와 빨라지는 정도가 다름)
    function upDuration() {
      const L = LEVELS[level];
      const elapsed = gameSeconds - (endTime - Date.now()) / 1000;
      return Math.max(L.minUp, L.startUp - elapsed * L.speedUp);
    }

    function spawn() {
      if (!running) return;
      const hole = randomHole();
      const isGold = Math.random() < GOLD_CHANCE;
      // 황금 두더지는 조금 더 빨리 숨음
      const duration = isGold ? upDuration() * 0.8 : upDuration();
      hole.classList.remove("hit", "gold");
      if (isGold) hole.classList.add("gold");
      hole.classList.add("up");
      setTimeout(() => hole.classList.remove("up", "hit"), duration);
      const L = LEVELS[level];
      spawnTimer = setTimeout(spawn, duration + L.gapMin + Math.random() * (L.gapMax - L.gapMin));
    }

    function whack(hole) {
      if (!running) return;
      if (!hole.classList.contains("up")) { Sound.miss(); return; } // 빈 구멍 클릭
      if (hole.classList.contains("hit")) return;                    // 이미 잡은 두더지
      const isGold = hole.classList.contains("gold");
      if (isGold) Sound.gold(); else Sound.hit();
      const points = isGold ? 3 : 1;
      hole.classList.add("hit");
      score += points;
      scoreEl.textContent = score;
      const pop = document.createElement("div");
      pop.className = isGold ? "pop gold" : "pop";
      pop.textContent = "+" + points;
      hole.appendChild(pop);
      setTimeout(() => pop.remove(), 500);
      setTimeout(() => hole.classList.remove("up", "hit"), 200);
    }

    function tick() {
      const left = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      timeEl.textContent = left;
      if (left <= 0) endGame();
    }

    // 15분 휴식 안내: 이번 방문에서 실제로 플레이한 시간을 누적 (5분 넘게 쉬면 다시 0부터)
    const REST_AFTER_SEC = 15 * 60;
    const IDLE_RESET_MS = 5 * 60 * 1000;
    let playedSec = 0;
    let lastEndAt = 0;

    function startGame() {
      if (running) return; // 키보드·버튼 동시 입력으로 두 번 시작되는 것 방지
      if (lastEndAt && Date.now() - lastEndAt > IDLE_RESET_MS) playedSec = 0;
      score = 0;
      scoreEl.textContent = 0;
      timeEl.textContent = gameSeconds;
      overlay.classList.add("hidden");
      hideQuote();
      running = true;
      endTime = Date.now() + gameSeconds * 1000;
      tickTimer = setInterval(tick, 100);
      Sound.startBgm(LEVELS[level].bgmTempo);
      spawn();
    }

    function endGame() {
      running = false;
      Sound.stopBgm();
      clearInterval(tickTimer);
      clearTimeout(spawnTimer);
      holes.forEach(h => h.classList.remove("up", "hit", "gold"));

      // 최고 기록과 비교해 "한 판 더" 안내 (목표에 가까울수록 의욕이 커지는 효과)
      let nudgeText;
      if (score > best) {
        best = score;
        saveBest(best);
        bestEl.textContent = best;
        nudgeText = '<span class="record">🎉 최고 기록 갱신!</span><br />이 기세로 한 판 더 해 볼까요?';
      } else if (best === 0) {
        nudgeText = "두더지를 잡아서 첫 기록을 만들어 보세요!";
      } else if (score === best) {
        nudgeText = '<span class="nudge">최고 기록과 동점! 1점만 더 하면 신기록이에요.</span>';
      } else {
        const gap = best - score;
        const close = gap <= Math.max(3, Math.ceil(best * 0.2));
        nudgeText = close
          ? `<span class="nudge">최고 기록까지 ${gap}점! 한 판 더 해 볼까요?</span>`
          : `최고 기록 ${best}점에 다시 도전해 보세요.`;
      }

      // 휴식 안내
      playedSec += gameSeconds;
      lastEndAt = Date.now();
      let restText = "";
      if (playedSec >= REST_AFTER_SEC) {
        restText = '<br /><span class="rest">👀 15분 넘게 즐겼어요. 잠깐 눈과 손목을 쉬어 가요.</span>';
        playedSec = 0;
      }

      titleEl.textContent = "게임 끝!";
      bodyEl.innerHTML = `${level}단계(${LEVELS[level].name}) · ${gameSeconds}초 점수: <b>${score}점</b><br />${nudgeText}${restText}`;
      startBtn.textContent = "다시 하기";
      overlay.classList.remove("hidden");
      showRandomQuote();
    }

    startBtn.addEventListener("click", startGame);

    // 스페이스바·엔터로 바로 시작 / 다시 하기
    document.addEventListener("keydown", e => {
      const isStartKey = e.key === " " || e.key === "Enter" || e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter";
      if (!isStartKey) return;
      if (e.target.closest && e.target.closest("summary")) return; // 도감 열고 닫기는 그대로
      e.preventDefault(); // 스페이스바로 화면이 스크롤되거나 버튼이 한 번 더 눌리는 것 방지
      if (!running && !e.repeat) startGame();
    });

    renderCollection();

    // 마우스로 도감을 열고 닫은 뒤에도 스페이스바·엔터가 게임 시작으로 동작하도록 포커스 해제
    const collectionSummary = document.querySelector("#collection summary");
    collectionSummary.addEventListener("mouseup", () => {
      setTimeout(() => collectionSummary.blur(), 0);
    });

    // 소리 켜기/끄기 (설정은 다음 방문 때도 유지)
    const soundBtn = document.getElementById("sound-btn");
    function updateSoundBtn() {
      const m = Sound.isMuted();
      soundBtn.textContent = m ? "🔇" : "🔊";
      soundBtn.setAttribute("aria-label", m ? "소리 켜기" : "소리 끄기");
    }
    soundBtn.addEventListener("click", () => {
      Sound.ensure();
      Sound.setMuted(!Sound.isMuted());
      updateSoundBtn();
    });
    updateSoundBtn();
  </script>
</body>
</html>
