<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>두더지 잡기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(#bfe6ff, #e8f7d4);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      user-select: none;
      color: #3b2a1a;
    }

    h1 { font-size: 32px; margin-bottom: 12px; }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hud div {
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      min-width: 78px;
      text-align: center;
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: min(92vw, 420px);
      background: #7cc35a;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 0 #5a9a3e;
    }

    .hole {
      position: relative;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 75%, #3a2414 45%, #5b3a22 70%);
      cursor: pointer;
    }

    /* 두더지 (CSS로 그림) */
    .mole {
      position: absolute;
      left: 15%;
      width: 70%;
      height: 80%;
      top: 100%;
      background: #8b5a2b;
      border-radius: 50% 50% 40% 40%;
      transition: top 0.12s ease-out;
    }
    .mole::before, .mole::after { /* 눈 */
      content: "";
      position: absolute;
      top: 28%;
      width: 12%;
      height: 14%;
      background: #1a1a1a;
      border-radius: 50%;
    }
    .mole::before { left: 28%; }
    .mole::after { right: 28%; }
    .mole .nose {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      width: 26%;
      height: 16%;
      background: #f29bb0;
      border-radius: 50%;
    }
    .hole.up .mole { top: 22%; }
    /* 황금 두더지 */
    .hole.gold .mole {
      background: radial-gradient(circle at 35% 30%, #fff6b0, #f5c518 55%, #c99a06);
      box-shadow: 0 0 14px 4px rgba(255, 215, 0, .8);
    }
    .hole.hit .mole { background: #c0392b; top: 22%; }
    .hole.hit .mole::before, .hole.hit .mole::after {
      background: transparent;
      height: 4%;
      border-top: 3px solid #1a1a1a;
      border-radius: 0;
    }

    .pop {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 3px rgba(0,0,0,.4);
      pointer-events: none;
      animation: pop 0.5s ease-out forwards;
    }
    .pop.gold { color: #ffd700; font-size: 28px; }
    @keyframes pop {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, -30px); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.88);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay p { font-size: 18px; line-height: 1.5; }
    .overlay .big { font-size: 28px; font-weight: 800; }
    .overlay .record { color: #d35400; font-weight: 800; }

    /* 게임 시간·난이도 선택 */
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-row .label { font-size: 14px; font-weight: 700; color: #6b5640; min-width: 34px; }
    .time-select { display: flex; gap: 8px; }
    .time-select button {
      font-size: 16px;
      padding: 8px 16px;
      color: #3b2a1a;
      background: #fff;
      border: 2px solid #e0c9a6;
      box-shadow: none;
    }
    .time-select button.selected {
      color: #fff;
      background: #8b5a2b;
      border-color: #8b5a2b;
    }
    .time-select button:active { transform: none; box-shadow: none; }

    button {
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: #e67e22;
      border: none;
      border-radius: 14px;
      padding: 12px 32px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b35f12;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b35f12; }

    /* 소리 켜기/끄기 버튼 */
    .hud .sound-btn {
      min-width: 0;
      width: 44px;
      padding: 0;
      font-size: 22px;
      line-height: 40px;
      color: #3b2a1a;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .hud .sound-btn:active { transform: translateY(1px); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    footer { margin-top: 18px; font-size: 13px; color: #5b6b4a; }
  </style>
</head>
<body>
  <h1>🔨 두더지 잡기</h1>

  <div class="hud">
    <div>단계 <span id="level">2</span></div>
    <div>점수 <span id="score">0</span></div>
    <div>시간 <span id="time">20</span></div>
    <div>최고 <span id="best">0</span></div>
    <button class="sound-btn" id="sound-btn" title="소리 켜기/끄기" aria-label="소리 끄기">🔊</button>
  </div>

  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <p class="big" id="msg-title">두더지를 잡아라!</p>
      <p id="msg-body">튀어나오는 두더지를 최대한 많이<br />클릭(터치)하세요.<br />✨ 황금 두더지는 <b>+3점</b>!</p>
      <div class="option-row">
        <span class="label">난이도</span>
        <div class="time-select" id="level-select">
          <button data-level="1">1단계</button>
          <button data-level="2" class="selected">2단계</button>
          <button data-level="3">3단계</button>
        </div>
      </div>
      <div class="option-row">
        <span class="label">시간</span>
        <div class="time-select" id="time-select">
          <button data-sec="20" class="selected">20초</button>
          <button data-sec="30">30초</button>
          <button data-sec="60">60초</button>
        </div>
      </div>
      <button id="start-btn">시작하기</button>
    </div>
  </div>

  <footer>Made with Aside</footer>

  <script>
    // ===== 소리 (Web Audio로 직접 만든 효과음·배경음악, 외부 음원 파일 없음) =====
    const Sound = (() => {
      let ctx = null, master = null, bgmGain = null, sfxGain = null;
      let muted = false;
      try { muted = localStorage.getItem("mole-muted") === "1"; } catch (e) {}

      // 브라우저 정책상 첫 클릭(터치) 이후에만 소리를 낼 수 있어서, 그때 준비
      function ensure() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
          bgmGain = ctx.createGain(); bgmGain.gain.value = 0.35; bgmGain.connect(master);
          sfxGain = ctx.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }

      // 음 하나 내기: 파형, 시작·끝 주파수, 길이, 볼륨
      function tone(type, f1, f2, start, dur, vol, out) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f1, start);
        if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g); g.connect(out || sfxGain);
        o.start(start); o.stop(start + dur + 0.02);
      }

      // 두더지 잡았을 때: "뿅"
      function hit() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        tone("square", 900, 300, t, 0.09, 0.25);
        tone("sine", 1400, 1400, t + 0.05, 0.08, 0.15);
      }
      // 황금 두더지: "띠링~" 올라가는 3음
      function gold() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        [1047, 1319, 1568, 2093].forEach((f, i) => tone("triangle", f, f, t + i * 0.06, 0.16, 0.25));
      }
      // 헛손질(빈 구멍 클릭): 낮은 "퉁"
      function miss() {
        if (!ensure()) return;
        const t = ctx.currentTime;
        tone("triangle", 220, 70, t, 0.18, 0.35);
      }

      // --- 배경음악: 직접 작곡한 4마디 반복 멜로디 (8분음표 단위, 0 = 쉼표) ---
      const MELODY = [76,0,79,76, 72,74,76,0,  77,0,81,77, 74,76,77,0,
                      79,81,79,77, 76,74,72,0,  74,76,74,71, 72,0,0,0];
      const BASS   = [48,0,43,0, 48,0,43,0,  41,0,48,0, 41,0,48,0,
                      43,0,50,0, 43,0,50,0,  43,0,47,0, 48,0,0,0];
      const midi = n => 440 * Math.pow(2, (n - 69) / 12);
      let bgmTimer = null, step = 0, nextTime = 0, bpm = 140;

      function scheduleBgm() {
        const eighth = 60 / bpm / 2;
        while (nextTime < ctx.currentTime + 0.15) {
          const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
          if (m) tone("square", midi(m), midi(m), nextTime, eighth * 0.9, 0.12, bgmGain);
          if (b) tone("triangle", midi(b), midi(b), nextTime, eighth * 1.8, 0.3, bgmGain);
          step++;
          nextTime += eighth;
        }
      }
      function startBgm(tempo) {
        if (!ensure()) return;
        stopBgm();
        bpm = tempo; step = 0; nextTime = ctx.currentTime + 0.05;
        scheduleBgm();
        bgmTimer = setInterval(scheduleBgm, 30);
      }
      function stopBgm() { clearInterval(bgmTimer); bgmTimer = null; }

      function setMuted(v) {
        muted = v;
        try { localStorage.setItem("mole-muted", v ? "1" : "0"); } catch (e) {}
        if (master) master.gain.setValueAtTime(v ? 0 : 1, ctx.currentTime);
      }

      // 다른 탭으로 가면 소리 멈춤, 돌아오면 다시
      document.addEventListener("visibilitychange", () => {
        if (!ctx) return;
        if (document.hidden) ctx.suspend(); else ctx.resume();
      });

      return { ensure, hit, gold, miss, startBgm, stopBgm, setMuted, isMuted: () => muted };
    })();

    const GOLD_CHANCE = 0.12; // 황금 두더지 등장 확률 (12%)
    let gameSeconds = 20;     // 선택한 게임 시간

    // 난이도별 속도 설정 (단위: 밀리초, 1000 = 1초)
    //   startUp : 게임 시작 때 두더지가 올라와 있는 시간 (클수록 느림)
    //   minUp   : 아무리 빨라져도 이보다 짧아지지 않는 한계
    //   speedUp : 1초 지날 때마다 줄어드는 시간 (클수록 빨리 빨라짐)
    //   gapMin, gapMax : 두더지가 숨은 뒤 다음 두더지가 나올 때까지 쉬는 시간
    const LEVELS = {
      1: { name: "느림", bgmTempo: 120, startUp: 1400, minUp: 750, speedUp: 12, gapMin: 300, gapMax: 650 },
      2: { name: "보통", bgmTempo: 140, startUp: 1000, minUp: 450, speedUp: 18, gapMin: 150, gapMax: 400 },
      3: { name: "빠름", bgmTempo: 165, startUp: 700,  minUp: 320, speedUp: 22, gapMin: 60,  gapMax: 220 },
    };
    let level = 2;            // 선택한 난이도 (기본 2단계)
    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const levelEl = document.getElementById("level");
    const bestEl = document.getElementById("best");
    const titleEl = document.getElementById("msg-title");
    const bodyEl = document.getElementById("msg-body");
    const startBtn = document.getElementById("start-btn");

    // 구멍 9개 만들기
    const holes = [];
    for (let i = 0; i < 9; i++) {
      const hole = document.createElement("div");
      hole.className = "hole";
      hole.innerHTML = '<div class="mole"><div class="nose"></div></div>';
      hole.addEventListener("pointerdown", () => whack(hole));
      board.insertBefore(hole, overlay);
      holes.push(hole);
    }

    let score = 0;
    let running = false;
    let endTime = 0;
    let lastHole = null;
    let spawnTimer = null;
    let tickTimer = null;
    // 최고 기록 저장 (시크릿 모드 등 저장소가 막혀 있어도 게임은 동작하도록)
    // 난이도·시간별로 따로 저장 (예: 1단계 20초 → mole-best-L1-20)
    // 2단계는 난이도 기능 이전 기록과 같은 키(mole-best-20)를 써서 예전 기록을 이어감
    function bestKey() {
      return level === 2 ? "mole-best-" + gameSeconds : "mole-best-L" + level + "-" + gameSeconds;
    }
    function loadBest() {
      try { return Number(localStorage.getItem(bestKey()) || 0); } catch (e) { return 0; }
    }
    function saveBest(value) {
      try { localStorage.setItem(bestKey(), value); } catch (e) {}
    }
    let best = loadBest();
    bestEl.textContent = best;

    // 시간 선택 버튼
    const timeButtons = document.querySelectorAll("#time-select button");
    timeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        gameSeconds = Number(btn.dataset.sec);
        timeButtons.forEach(b => b.classList.toggle("selected", b === btn));
        timeEl.textContent = gameSeconds;
        best = loadBest();
        bestEl.textContent = best;
      });
    });

    // 난이도 선택 버튼
    const levelButtons = document.querySelectorAll("#level-select button");
    levelButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        level = Number(btn.dataset.level);
        levelButtons.forEach(b => b.classList.toggle("selected", b === btn));
        levelEl.textContent = level;
        best = loadBest();
        bestEl.textContent = best;
      });
    });

    function randomHole() {
      let hole;
      do { hole = holes[Math.floor(Math.random() * holes.length)]; }
      while (hole === lastHole);
      lastHole = hole;
      return hole;
    }

    // 시간이 지날수록 두더지가 빨라짐 (난이도에 따라 시작 속도와 빨라지는 정도가 다름)
    function upDuration() {
      const L = LEVELS[level];
      const elapsed = gameSeconds - (endTime - Date.now()) / 1000;
      return Math.max(L.minUp, L.startUp - elapsed * L.speedUp);
    }

    function spawn() {
      if (!running) return;
      const hole = randomHole();
      const isGold = Math.random() < GOLD_CHANCE;
      // 황금 두더지는 조금 더 빨리 숨음
      const duration = isGold ? upDuration() * 0.8 : upDuration();
      hole.classList.remove("hit", "gold");
      if (isGold) hole.classList.add("gold");
      hole.classList.add("up");
      setTimeout(() => hole.classList.remove("up", "hit"), duration);
      const L = LEVELS[level];
      spawnTimer = setTimeout(spawn, duration + L.gapMin + Math.random() * (L.gapMax - L.gapMin));
    }

    function whack(hole) {
      if (!running) return;
      if (!hole.classList.contains("up")) { Sound.miss(); return; } // 빈 구멍 클릭
      if (hole.classList.contains("hit")) return;                    // 이미 잡은 두더지
      const isGold = hole.classList.contains("gold");
      if (isGold) Sound.gold(); else Sound.hit();
      const points = isGold ? 3 : 1;
      hole.classList.add("hit");
      score += points;
      scoreEl.textContent = score;
      const pop = document.createElement("div");
      pop.className = isGold ? "pop gold" : "pop";
      pop.textContent = "+" + points;
      hole.appendChild(pop);
      setTimeout(() => pop.remove(), 500);
      setTimeout(() => hole.classList.remove("up", "hit"), 200);
    }

    function tick() {
      const left = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      timeEl.textContent = left;
      if (left <= 0) endGame();
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = 0;
      timeEl.textContent = gameSeconds;
      overlay.classList.add("hidden");
      running = true;
      endTime = Date.now() + gameSeconds * 1000;
      tickTimer = setInterval(tick, 100);
      Sound.startBgm(LEVELS[level].bgmTempo);
      spawn();
    }

    function endGame() {
      running = false;
      Sound.stopBgm();
      clearInterval(tickTimer);
      clearTimeout(spawnTimer);
      holes.forEach(h => h.classList.remove("up", "hit", "gold"));

      let recordText = "";
      if (score > best) {
        best = score;
        saveBest(best);
        bestEl.textContent = best;
        recordText = '<br /><span class="record">🎉 최고 기록 갱신!</span>';
      }
      titleEl.textContent = "게임 끝!";
      bodyEl.innerHTML = `${level}단계(${LEVELS[level].name}) · ${gameSeconds}초 점수: <b>${score}점</b>${recordText}<br />난이도나 시간을 바꿔서 도전해 보세요.`;
      startBtn.textContent = "다시 하기";
      overlay.classList.remove("hidden");
    }

    startBtn.addEventListener("click", startGame);

    // 소리 켜기/끄기 (설정은 다음 방문 때도 유지)
    const soundBtn = document.getElementById("sound-btn");
    function updateSoundBtn() {
      const m = Sound.isMuted();
      soundBtn.textContent = m ? "🔇" : "🔊";
      soundBtn.setAttribute("aria-label", m ? "소리 켜기" : "소리 끄기");
    }
    soundBtn.addEventListener("click", () => {
      Sound.ensure();
      Sound.setMuted(!Sound.isMuted());
      updateSoundBtn();
    });
    updateSoundBtn();
  </script>
</body>
</html>
